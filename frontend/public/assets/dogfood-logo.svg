<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- DogFood: stylized paw print with code brackets -->
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>
  <!-- Main pad -->
  <ellipse cx="32" cy="40" rx="14" ry="10" fill="url(#pGrad)" opacity="0.95"/>
  <!-- Top paw beans -->
  <ellipse cx="16" cy="25" rx="5.5" ry="4" fill="url(#pGrad)" opacity="0.85"/>
  <ellipse cx="26" cy="20" rx="5.5" ry="4" fill="url(#pGrad)" opacity="0.85"/>
  <ellipse cx="38" cy="20" rx="5.5" ry="4" fill="url(#pGrad)" opacity="0.85"/>
  <ellipse cx="48" cy="25" rx="5.5" ry="4" fill="url(#pGrad)" opacity="0.85"/>
  <!-- Subtle code brackets inside main pad -->
  <text x="25" y="44" font-family="monospace" font-size="11" font-weight="700" fill="rgba(7,10,8,0.7)">&lt;/&gt;</text>
</svg>
